<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negociação de Figurinhas – Copa 2026</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Página pública de troca ── */
    .public-page { max-width: 680px; margin: 0 auto; padding: 16px; font-family: inherit; }
    .public-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card-bg, #1a1a2e); border-radius: 12px; margin-bottom: 18px; }
    .public-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid #c0a020; }
    .public-avatar-placeholder { width: 52px; height: 52px; border-radius: 50%; background: #c0a020; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .public-user-name { font-size: 18px; font-weight: 700; color: #f0f0f0; }
    .public-user-sub { font-size: 12px; color: #aaa; margin-top: 2px; }
    .public-badge { display: inline-block; background: #c0a020; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-top: 4px; }
    .public-section { background: var(--card-bg, #1a1a2e); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
    .public-section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; user-select: none; }
    .public-section-header:hover { background: rgba(255,255,255,0.04); }
    .public-section-title { font-size: 14px; font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }
    .public-section-body { padding: 0 16px 14px; }
    .public-sticker-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .public-sticker-chip { background: #2a2a3e; border-radius: 6px; padding: 4px 8px; font-size: 11px; color: #ccc; display: flex; flex-direction: column; align-items: center; min-width: 44px; }
    .public-sticker-chip .chip-code { font-weight: 700; color: #f0f0f0; font-size: 12px; }
    .public-sticker-chip .chip-qty { color: #c0a020; font-size: 10px; }
    .public-sticker-chip.missing { background: #1e1e2e; border: 1px solid #3a3a5e; }
    .public-propose-btn { width: 100%; padding: 12px; background: #c0a020; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; transition: background 0.2s; }
    .public-propose-btn:hover { background: #a08010; }
    .public-propose-btn:disabled { background: #555; cursor: not-allowed; }
    .public-locked { text-align: center; padding: 40px 20px; color: #aaa; }
    .public-locked svg { margin-bottom: 12px; opacity: 0.5; }
    .public-locked h2 { color: #e0e0e0; margin-bottom: 8px; }
    .public-loading { text-align: center; padding: 60px 20px; color: #aaa; }
    .public-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .public-modal { background: #1a1a2e; border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .public-modal h3 { margin: 0 0 14px; color: #f0f0f0; font-size: 16px; }
    .public-modal label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 10px; }
    .public-modal input, .public-modal textarea, .public-modal select { width: 100%; padding: 8px 10px; background: #2a2a3e; border: 1px solid #3a3a5e; border-radius: 8px; color: #f0f0f0; font-size: 13px; box-sizing: border-box; }
    .public-modal textarea { resize: vertical; min-height: 60px; }
    .public-modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .public-modal-actions button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-cancel-modal { background: #2a2a3e; color: #ccc; }
    .btn-submit-modal { background: #c0a020; color: #fff; }
    .btn-submit-modal:disabled { background: #555; cursor: not-allowed; }
    .sticker-select-grid { display: flex; flex-wrap: wrap; gap: 5px; max-height: 200px; overflow-y: auto; padding: 8px; background: #12121e; border-radius: 8px; margin-top: 6px; }
    .sticker-select-chip { padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; background: #2a2a3e; color: #ccc; border: 1px solid transparent; transition: all 0.15s; }
    .sticker-select-chip.selected { background: #c0a020; color: #fff; border-color: #c0a020; }
    .sticker-select-chip:hover:not(.selected) { border-color: #c0a020; color: #f0f0f0; }
    .type-toggle { display: flex; gap: 8px; margin-top: 6px; }
    .type-toggle button { flex: 1; padding: 8px; border-radius: 8px; border: 2px solid #3a3a5e; background: transparent; color: #ccc; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .type-toggle button.active { border-color: #c0a020; color: #c0a020; background: rgba(192,160,32,0.1); }
    .collapse-arrow-pub { transition: transform 0.2s; }
    .collapsed-pub .collapse-arrow-pub { transform: rotate(-90deg); }
    .collapsed-pub .public-section-body { display: none; }
  </style>
</head>
<body>
  <div id="public-root" class="public-page">
    <div class="public-loading">
      <div class="spinner"></div>
      <p>Carregando…</p>
    </div>
  </div>

  <!-- Modal de proposta -->
  <div id="public-proposal-modal" class="public-modal-overlay" style="display:none">
    <div class="public-modal">
      <h3 id="pub-modal-title">Nova Proposta</h3>

      <label>Tipo de negociação</label>
      <div class="type-toggle">
        <button id="pub-type-troca" class="active" onclick="setPubType('troca')">🔄 Troca</button>
        <button id="pub-type-venda" onclick="setPubType('venda')">💰 Compra/Venda</button>
      </div>

      <div id="pub-role-wrap" style="display:none">
        <label>Você é o(a)…</label>
        <select id="pub-role">
          <option value="comprador">Comprador (você paga)</option>
          <option value="vendedor">Vendedor (você recebe)</option>
        </select>
      </div>

      <div id="pub-value-wrap" style="display:none">
        <label>Valor (R$)</label>
        <input type="number" id="pub-value" min="0" step="0.01" placeholder="0,00" />
      </div>

      <label>Figurinhas que você OFERECE ao <span id="pub-owner-name-inline">colecionador</span></label>
      <div id="pub-offer-grid" class="sticker-select-grid"></div>

      <div id="pub-want-section">
        <label>Figurinhas que você QUER (faltantes do colecionador)</label>
        <div id="pub-want-grid" class="sticker-select-grid"></div>
      </div>

      <label>Seu nome</label>
      <input type="text" id="pub-sender-name" placeholder="Como quer ser chamado(a)" />

      <label>Seu contato (WhatsApp, e-mail, etc.)</label>
      <input type="text" id="pub-sender-contact" placeholder="Para o colecionador entrar em contato" />

      <label>Mensagem (opcional)</label>
      <textarea id="pub-message" placeholder="Alguma observação…"></textarea>

      <div class="public-modal-actions">
        <button class="btn-cancel-modal" onclick="closePubModal()">Cancelar</button>
        <button class="btn-submit-modal" id="btn-pub-submit" onclick="submitPubProposal()">Enviar Proposta</button>
      </div>
    </div>
  </div>

  <script type="module" src="troca.js"></script>
</body>
</html>
